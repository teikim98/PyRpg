<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PyRpg · UI 개발 페이지</title>
    <style>
      body { margin: 0; background: #05070f; color: #ddd; font: 13px sans-serif; }
      #tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; }
      #tools button { font: inherit; padding: 4px 8px; }
      #game {
        width: 1280px; height: 720px; margin: 0 8px; overflow: hidden;
        background: repeating-conic-gradient(#2d5a2a 0 25%, #336633 0 50%) 0 0 / 32px 32px;
      }
      #game canvas { display: block; width: 100%; height: 100%; }
      #log { margin: 8px; white-space: pre-wrap; color: #9c9; }
    </style>
  </head>
  <body>
    <div id="tools"></div>
    <div id="game"><canvas width="320" height="180"></canvas></div>
    <pre id="log"></pre>
    <script type="module" src="./ui.ts"></script>
  </body>
</html>
